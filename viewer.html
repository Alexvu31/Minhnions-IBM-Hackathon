<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bob Logbook Viewer</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.6;
    background: #f7f8fa;
    color: #1f2328;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ── */
  .site-header {
    background: #1f2328;
    color: #fff;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
    z-index: 10;
  }
  .logo {
    width: 30px; height: 30px;
    background: #3b82d4;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700; color: #fff; flex-shrink: 0;
  }
  .site-header h1 { font-size: 15px; font-weight: 600; }
  .site-header .meta { font-size: 11px; color: #8b949e; margin-left: 6px; }
  .header-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 12px;
    border: 1px solid #444d56;
    border-radius: 5px;
    background: transparent;
    color: #e6edf3;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
  }
  .btn:hover { background: #30363d; border-color: #8b949e; }
  .btn-primary { background: #3b82d4; border-color: #3b82d4; color: #fff; }
  .btn-primary:hover { background: #2563c0; border-color: #2563c0; }

  /* ── Upload screen ── */
  #upload-screen {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }
  .drop-area {
    border: 2px dashed #d0d7de;
    border-radius: 10px;
    background: #fff;
    padding: 60px 48px;
    text-align: center;
    cursor: pointer;
    max-width: 500px;
    width: 100%;
    transition: border-color 0.15s, background 0.15s;
  }
  .drop-area:hover, .drop-area.drag-over { border-color: #3b82d4; background: #f0f6ff; }
  .drop-area input[type="file"] { display: none; }
  .drop-area .icon { font-size: 40px; color: #57606a; margin-bottom: 14px; }
  .drop-area h2 { font-size: 16px; margin-bottom: 6px; }
  .drop-area p { color: #57606a; font-size: 13px; margin-bottom: 14px; }
  .drop-area label {
    display: inline-block; background: #3b82d4; color: #fff;
    padding: 8px 20px; border-radius: 6px; cursor: pointer;
    font-size: 13px; font-weight: 500;
  }
  .drop-area label:hover { background: #2563c0; }
  .drop-area .hint { margin-top: 14px; font-size: 11px; color: #8b949e; }

  /* ── Workspace layout ── */
  #workspace {
    flex: 1;
    display: none;
    overflow: hidden;
  }
  .workspace-inner {
    display: flex;
    height: 100%;
  }

  /* ── Sidebar / file tree ── */
  .sidebar {
    width: 220px;
    flex-shrink: 0;
    background: #ffffff;
    border-right: 1px solid #e5e7eb;
    overflow-y: auto;
    padding: 12px 0;
  }
  .sidebar-label {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #57606a;
    padding: 4px 14px 8px;
  }
  .tree-folder {
    padding: 3px 14px;
    font-size: 12px;
    color: #57606a;
    font-weight: 600;
  }
  .tree-folder::before { content: '📁 '; }
  .tree-file {
    padding: 5px 14px 5px 26px;
    font-size: 12.5px;
    color: #1f2328;
    cursor: pointer;
    border-radius: 4px;
    margin: 0 4px;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tree-file:hover { background: #f3f4f6; }
  .tree-file.active { background: #dbeafe; color: #1d4ed8; font-weight: 500; }
  .tree-file .file-icon { flex-shrink: 0; }
  .author-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
  }

  /* ── Content panel ── */
  .content-panel {
    flex: 1;
    overflow-y: auto;
    padding: 24px 32px;
    background: #f7f8fa;
  }
  .panel-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
    padding-bottom: 14px;
    border-bottom: 1px solid #e5e7eb;
  }
  .panel-header h2 { font-size: 15px; font-weight: 600; color: #1f2328; }
  .panel-header .entry-count { font-size: 12px; color: #57606a; }

  /* ── Timeline cards ── */
  .timeline-wrap { position: relative; padding-left: 28px; }
  .timeline-wrap::before {
    content: '';
    position: absolute;
    left: 8px; top: 10px; bottom: 10px;
    width: 2px; background: #e5e7eb;
  }
  .entry {
    position: relative;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 14px;
  }
  .entry::before {
    content: '';
    position: absolute;
    left: -23px; top: 16px;
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--author-color, #57606a);
    border: 2px solid #fff;
    box-shadow: 0 0 0 2px var(--author-color, #57606a);
  }
  .entry-header {
    display: flex; align-items: center; flex-wrap: wrap; gap: 7px;
    margin-bottom: 9px;
  }
  .badge-author {
    display: inline-flex; align-items: center;
    padding: 2px 9px; border-radius: 20px;
    font-size: 11px; font-weight: 600; color: #fff;
    background: var(--author-color, #57606a);
  }
  .badge-type {
    display: inline-block; padding: 2px 7px; border-radius: 4px;
    font-size: 10px; font-weight: 500; text-transform: uppercase;
    letter-spacing: 0.05em; border: 1px solid currentColor;
  }
  .type-user-prompt   { color: #1d4ed8; border-color: #bfdbfe; background: #eff6ff; }
  .type-bob-response  { color: #15803d; border-color: #bbf7d0; background: #f0fdf4; }
  .type-stop          { color: #15803d; border-color: #bbf7d0; background: #f0fdf4; }
  .type-prompt        { color: #1d4ed8; border-color: #bfdbfe; background: #eff6ff; }
  .type-manual        { color: #b45309; border-color: #fde68a; background: #fefce8; }
  .type-decision      { color: #7c3aed; border-color: #ddd6fe; background: #f5f3ff; }
  .type-note          { color: #0369a1; border-color: #bae6fd; background: #f0f9ff; }
  .type-unknown       { color: #57606a; border-color: #d0d7de; background: #f7f8fa; }
  .entry-ts { font-size: 11px; color: #57606a; margin-left: auto; white-space: nowrap; }
  .entry-session { font-size: 10px; color: #8b949e; }
  .entry-body {
    font-size: 13px; line-height: 1.65; color: #24292f;
    white-space: pre-wrap; word-break: break-word;
  }
  .entry-body code {
    background: #f6f8fa; border: 1px solid #e5e7eb;
    border-radius: 3px; padding: 1px 4px;
    font-size: 11.5px;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }

  /* ── Plain Markdown renderer ── */
  .md-view { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 24px 28px; }
  .md-view h1 { font-size: 20px; border-bottom: 1px solid #e5e7eb; padding-bottom: 8px; margin-bottom: 14px; }
  .md-view h2 { font-size: 16px; margin: 18px 0 8px; }
  .md-view h3 { font-size: 14px; margin: 14px 0 6px; }
  .md-view p  { margin-bottom: 10px; }
  .md-view ul, .md-view ol { padding-left: 20px; margin-bottom: 10px; }
  .md-view li { margin-bottom: 3px; }
  .md-view code {
    background: #f6f8fa; border: 1px solid #e5e7eb;
    border-radius: 3px; padding: 1px 5px;
    font-size: 12px;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  .md-view pre {
    background: #f6f8fa; border: 1px solid #e5e7eb;
    border-radius: 6px; padding: 14px; overflow-x: auto;
    margin-bottom: 12px;
  }
  .md-view pre code { background: none; border: none; padding: 0; font-size: 12px; }
  .md-view strong { font-weight: 600; }
  .md-view hr { border: none; border-top: 1px solid #e5e7eb; margin: 14px 0; }
  .md-view blockquote {
    border-left: 3px solid #d0d7de; padding-left: 14px;
    color: #57606a; margin-bottom: 10px;
  }

  /* ── Empty / placeholder ── */
  .placeholder {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100%; color: #57606a; text-align: center; padding: 40px;
  }
  .placeholder h3 { font-size: 15px; color: #1f2328; margin-bottom: 6px; }

  /* ── Print ── */
  @media print {
    body { height: auto; display: block; }
    .site-header { background: #1f2328 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    #upload-screen { display: none !important; }
    #workspace { display: block !important; }
    .workspace-inner { display: block; }
    .sidebar { display: none; }
    .content-panel { padding: 0; background: #fff; }
    .header-right { display: none; }
    .entry { page-break-inside: avoid; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .badge-author, .badge-type { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }

  /* ── Footer ── */
  .site-footer {
    text-align: center; font-size: 12px; color: #8b949e;
    padding: 12px 16px; border-top: 1px solid #e5e7eb;
    flex-shrink: 0; background: #fff;
  }
</style>
</head>
<body>

<!-- ── Header ── -->
<header class="site-header">
  <div class="logo">B</div>
  <h1>Bob Logbook</h1>
  <span class="meta" id="export-meta"></span>
  <div class="header-right">
    <button class="btn" id="btn-reload" onclick="showUpload()" style="display:none;">↩ Load another</button>
    <button class="btn btn-primary" onclick="window.print()">🖨 Print</button>
  </div>
</header>

<!-- ── Upload screen ── -->
<div id="upload-screen">
  <div class="drop-area" id="drop-area">
    <div class="icon">📂</div>
    <h2>Open Bob Logbook export</h2>
    <p>Drag &amp; drop <strong>bob-context-export.json</strong> here, or</p>
    <label for="file-input">Choose file</label>
    <input type="file" id="file-input" accept=".json,application/json">
    <p class="hint">Runs entirely in-browser · no data leaves your machine</p>
  </div>
</div>

<!-- ── Workspace ── -->
<div id="workspace">
  <div class="workspace-inner">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="content-panel" id="content-panel">
      <div class="placeholder"><h3>Select a file</h3><p>Choose a file from the sidebar to view it.</p></div>
    </main>
  </div>
</div>

<footer class="site-footer">Made with IBM Bob</footer>

<script>
// ── Author colour palette ────────────────────────────────────────────────────
const PALETTE = ['#3b82d4','#7c5cd8','#059669','#dc6c2c','#dc2626','#0891b2','#7c3aed','#c026d3'];
const _colorCache = {};
function authorColor(name) {
  const k = (name || 'unknown').toLowerCase();
  if (_colorCache[k]) return _colorCache[k];
  let h = 0;
  for (let i = 0; i < k.length; i++) h = (h * 31 + k.charCodeAt(i)) >>> 0;
  return (_colorCache[k] = PALETTE[h % PALETTE.length]);
}

// ── HTML escape ──────────────────────────────────────────────────────────────
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── Minimal Markdown → HTML ──────────────────────────────────────────────────
function mdToHtml(src) {
  const lines = src.split('\n');
  let html = '';
  let inPre = false, inUl = false, inOl = false;
  for (let i = 0; i < lines.length; i++) {
    let l = lines[i];
    // fenced code block
    if (/^```/.test(l)) { inPre = !inPre; html += inPre ? '<pre><code>' : '</code></pre>\n'; continue; }
    if (inPre) { html += esc(l) + '\n'; continue; }
    // close lists
    if (inUl && !/^\s*[-*+]\s/.test(l)) { html += '</ul>\n'; inUl = false; }
    if (inOl && !/^\s*\d+\.\s/.test(l)) { html += '</ol>\n'; inOl = false; }
    // headings
    const hm = l.match(/^(#{1,3})\s+(.*)/);
    if (hm) { const hn = hm[1].length; html += `<h${hn}>${inline(hm[2])}</h${hn}>\n`; continue; }
    // hr
    if (/^---+$/.test(l.trim())) { html += '<hr>\n'; continue; }
    // blockquote
    if (/^>\s/.test(l)) { html += `<blockquote>${inline(l.slice(2))}</blockquote>\n`; continue; }
    // ul
    const ulm = l.match(/^\s*[-*+]\s+(.*)/);
    if (ulm) { if (!inUl) { html += '<ul>\n'; inUl = true; } html += `<li>${inline(ulm[1])}</li>\n`; continue; }
    // ol
    const olm = l.match(/^\s*\d+\.\s+(.*)/);
    if (olm) { if (!inOl) { html += '<ol>\n'; inOl = true; } html += `<li>${inline(olm[1])}</li>\n`; continue; }
    // paragraph / blank
    if (l.trim() === '') { html += '\n'; continue; }
    html += `<p>${inline(l)}</p>\n`;
  }
  if (inUl) html += '</ul>\n';
  if (inOl) html += '</ol>\n';
  return html;
}
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g, '<em>$1</em>');
}

// ── Parse chat Markdown entries ──────────────────────────────────────────────
// Format: ## Entry-NNN — title \n **Field:** value \n\n body \n\n ---
function parseChatEntries(md) {
  const entries = [];
  const sections = md.split(/^(?=##\s)/m).filter(s => s.trim());
  for (const sec of sections) {
    const lines = sec.split('\n');
    if (!/^##\s/.test(lines[0])) continue;
    const title = lines[0].replace(/^##\s+/, '').trim();
    const meta = {};
    let bodyStart = 1;
    for (let i = 1; i < lines.length; i++) {
      const m = lines[i].match(/^\*\*(\w[\w-]*):\*\*\s*(.+)/);
      if (m) { meta[m[1].toLowerCase()] = m[2].trim(); bodyStart = i + 1; }
      else if (lines[i].trim() === '' && i < 8) continue;
      else if (i > 1 && lines[i].trim() !== '') { bodyStart = i; break; }
    }
    const body = lines.slice(bodyStart).join('\n').replace(/\n---\s*$/, '').trim();
    entries.push({
      title,
      timestamp: meta['timestamp'] || meta['date'] || '',
      author:    meta['author'] || 'unknown',
      type:      (meta['type'] || 'unknown').toLowerCase(),
      session:   meta['session'] || '',
      body,
    });
  }
  return entries;
}

// ── Render timeline (chat/ files) ───────────────────────────────────────────
function renderTimeline(entries, filePath) {
  if (!entries.length) {
    return `<div class="placeholder"><h3>No entries</h3><p>No recognisable entries found in <code>${esc(filePath)}</code>.</p></div>`;
  }
  let html = `<div class="panel-header"><h2>${esc(filePath)}</h2><span class="entry-count">${entries.length} entries</span></div>`;
  html += '<div class="timeline-wrap">';
  for (const e of entries) {
    const color = authorColor(e.author);
    const typeKey = e.type.replace(/[^a-z-]/g, '');
    const typeClass = ['user-prompt','bob-response','stop','prompt','manual','decision','note'].includes(typeKey)
      ? 'type-' + typeKey : 'type-unknown';
    html += `<div class="entry" style="--author-color:${color}">
      <div class="entry-header">
        <span class="badge-author">${esc(e.author)}</span>
        <span class="badge-type ${typeClass}">${esc(e.type)}</span>
        ${e.title ? `<span style="font-size:12px;color:#57606a;">${esc(e.title)}</span>` : ''}
        ${e.session ? `<span class="entry-session">session: ${esc(e.session)}</span>` : ''}
        ${e.timestamp ? `<span class="entry-ts">${esc(e.timestamp)}</span>` : ''}
      </div>
      ${e.body ? `<div class="entry-body">${inline(e.body)}</div>` : ''}
    </div>`;
  }
  html += '</div>';
  return html;
}

// ── Render plain Markdown ────────────────────────────────────────────────────
function renderMarkdown(content, filePath) {
  return `<div class="panel-header"><h2>${esc(filePath)}</h2></div>
    <div class="md-view">${mdToHtml(content)}</div>`;
}

// ── Build sidebar ────────────────────────────────────────────────────────────
let _files = {};
let _activeFile = null;

function buildSidebar(files) {
  // Group by folder
  const folders = {};
  for (const path of Object.keys(files)) {
    const parts = path.split('/');
    const folder = parts.length > 1 ? parts[0] : '';
    if (!folders[folder]) folders[folder] = [];
    folders[folder].push(path);
  }

  let html = '<div class="sidebar-label">Shadow Branch</div>';
  for (const [folder, paths] of Object.entries(folders)) {
    if (folder) html += `<div class="tree-folder">${esc(folder)}</div>`;
    for (const p of paths) {
      const fname = p.split('/').pop();
      const isChat = p.startsWith('chat/');
      const color  = isChat ? authorColor(fname.replace('.md','')) : '#57606a';
      html += `<div class="tree-file" data-path="${esc(p)}" onclick="openFile('${p.replace(/'/g,"\\'")}')">
        <span class="author-dot" style="background:${color}"></span>
        <span>${esc(fname)}</span>
      </div>`;
    }
  }
  document.getElementById('sidebar').innerHTML = html;
}

function openFile(path) {
  _activeFile = path;
  // Update active state
  document.querySelectorAll('.tree-file').forEach(el => {
    el.classList.toggle('active', el.dataset.path === path);
  });
  const content = _files[path] || '';
  const isChat  = path.startsWith('chat/');
  const panel   = document.getElementById('content-panel');
  if (isChat) {
    const entries = parseChatEntries(content);
    panel.innerHTML = renderTimeline(entries, path);
  } else {
    panel.innerHTML = renderMarkdown(content, path);
  }
}

// ── Load export JSON ─────────────────────────────────────────────────────────
function loadExport(json, fileName) {
  _files = json.files || {};
  const paths = Object.keys(_files);
  if (!paths.length) {
    alert('No files found in this export.');
    return;
  }
  // Header meta
  const metaEl = document.getElementById('export-meta');
  metaEl.textContent = json.exported_at ? `exported ${json.exported_at}` : fileName;

  buildSidebar(_files);
  showWorkspace();

  // Auto-open first chat file, or first file
  const first = paths.find(p => p.startsWith('chat/')) || paths[0];
  openFile(first);
}

// ── Show/hide screens ────────────────────────────────────────────────────────
function showUpload() {
  document.getElementById('upload-screen').style.display = '';
  document.getElementById('workspace').style.display     = 'none';
  document.getElementById('btn-reload').style.display    = 'none';
}
function showWorkspace() {
  document.getElementById('upload-screen').style.display = 'none';
  document.getElementById('workspace').style.display     = '';
  document.getElementById('btn-reload').style.display    = '';
}

// ── File input wiring ────────────────────────────────────────────────────────
document.getElementById('file-input').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try { loadExport(JSON.parse(ev.target.result), file.name); }
    catch(err) { alert('Could not parse file. Make sure it is a valid bob-context-export.json.\n\n' + err.message); }
  };
  reader.readAsText(file);
});

// Drag and drop
const dropArea = document.getElementById('drop-area');
dropArea.addEventListener('dragover',  e => { e.preventDefault(); dropArea.classList.add('drag-over'); });
dropArea.addEventListener('dragleave', ()  => dropArea.classList.remove('drag-over'));
dropArea.addEventListener('drop', e => {
  e.preventDefault(); dropArea.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try { loadExport(JSON.parse(ev.target.result), file.name); }
    catch(err) { alert('Invalid JSON export.\n\n' + err.message); }
  };
  reader.readAsText(file);
});
dropArea.addEventListener('click', e => {
  if (e.target.tagName !== 'LABEL') document.getElementById('file-input').click();
});

// ── Demo mode: ?demo in URL ───────────────────────────────────────────────────
if (location.search.includes('demo')) {
  const demo = {
    exported_at: new Date().toISOString(),
    branch: 'bob-context',
    files: {
      'chat/jaminleod.md': '## Entry-001 — UserPromptSubmit\n**Timestamp:** 2026-11-24T11:03:12Z\n**Author:** jaminleod\n**Type:** user-prompt\n**Session:** abc-001\n\nLet\'s plan the Bob Logbook project. What\'s the best architecture?\n\n---\n\n## Entry-002 — Stop\n**Timestamp:** 2026-11-24T11:03:58Z\n**Author:** jaminleod\n**Type:** bob-response\n**Session:** abc-001\n\nI recommend a shadow branch approach using git orphan branches. The key insight is that `git checkout --orphan bob-context` creates a branch with no shared history.\n\n---\n',
      'chat/alexvu31.md': '## Entry-001 — UserPromptSubmit\n**Timestamp:** 2026-11-24T14:10:22Z\n**Author:** alexvu31\n**Type:** user-prompt\n**Session:** def-001\n\nExecute sub-task 4 and sub-task 5\n\n---\n\n## Entry-002 — Stop\n**Timestamp:** 2026-11-24T14:11:05Z\n**Author:** alexvu31\n**Type:** bob-response\n**Session:** def-001\n\nBuilt `viewer.html` with file picker, timeline renderer, and print-friendly CSS. Also wrote `test-bob-log.sh` and `README.md`.\n\n---\n',
      'decisions.md': '# Decisions\n\n## Idea Selection\n**Author:** jaminleod\n\nChosen idea: **Bob Logbook** — a git shadow-branch workspace.\n\n## Tech Stack\n**Author:** jaminleod\n\nPython 3 stdlib only. No pip installs.\n',
    }
  };
  loadExport(demo, 'demo');
}
