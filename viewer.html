<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bob Logbook</title>
<style>
/* ── IBM Carbon Design tokens ──────────────────────────────────────────── */
:root {
  --ibm-blue-60:   #0F62FE;
  --ibm-blue-70:   #0043CE;
  --ibm-blue-80:   #002D9C;
  --ibm-navy:      #001141;
  --ibm-gray-10:   #F4F4F4;
  --ibm-gray-20:   #E0E0E0;
  --ibm-gray-40:   #A8A8A8;
  --ibm-gray-70:   #525252;
  --ibm-gray-100:  #161616;
  --white:         #FFFFFF;
  --tab-h:         40px;
  --sidebar-w:     44px;
  --sidebar-open:  220px;
  --header-h:      48px;
}

/* ── Reset ─────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: "IBM Plex Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
             font-size: 14px; line-height: 1.5; color: var(--ibm-gray-100); background: var(--white); }

/* ── App shell ──────────────────────────────────────────────────────────── */
#app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

/* ── Header ─────────────────────────────────────────────────────────────── */
header {
  height: var(--header-h); flex-shrink: 0;
  display: flex; align-items: center; gap: 10px;
  padding: 0 16px;
  background: var(--ibm-navy); color: var(--white);
  border-bottom: 1px solid rgba(255,255,255,.08);
  z-index: 10;
}
header .logo { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; letter-spacing: .2px; }
header .logo svg { flex-shrink: 0; }
header .meta { margin-left: auto; font-size: 12px; color: rgba(255,255,255,.55); }
#load-btn {
  display: flex; align-items: center; gap: 5px;
  padding: 5px 12px; background: var(--ibm-blue-60); color: var(--white);
  border: none; border-radius: 2px; cursor: pointer; font-size: 13px; font-weight: 500;
  transition: background .15s;
}
#load-btn:hover { background: var(--ibm-blue-70); }
#file-input { display: none; }
#drop-overlay {
  display: none; position: fixed; inset: 0; z-index: 100;
  background: rgba(0,17,65,.7); align-items: center; justify-content: center;
  color: var(--white); font-size: 20px; font-weight: 600; letter-spacing: .3px;
  pointer-events: none;
}
#drop-overlay.active { display: flex; }

/* ── Tab bar ─────────────────────────────────────────────────────────────── */
#tab-bar {
  height: var(--tab-h); flex-shrink: 0;
  display: flex; align-items: stretch;
  background: var(--ibm-gray-10); border-bottom: 1px solid var(--ibm-gray-20);
  overflow-x: auto; overflow-y: hidden;
}
#tab-bar::-webkit-scrollbar { height: 3px; }
#tab-bar::-webkit-scrollbar-thumb { background: var(--ibm-gray-20); }

.tab {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 0 14px; white-space: nowrap; cursor: pointer;
  font-size: 13px; color: var(--ibm-gray-70);
  border-right: 1px solid var(--ibm-gray-20);
  border-bottom: 2px solid transparent;
  transition: color .12s, border-color .12s, background .12s;
  user-select: none; flex-shrink: 0;
}
.tab:hover { background: var(--ibm-gray-20); color: var(--ibm-gray-100); }
.tab.active {
  background: var(--white); color: var(--ibm-blue-60);
  border-bottom-color: var(--ibm-blue-60); font-weight: 500;
}
.tab .tab-close {
  display: inline-flex; align-items: center; justify-content: center;
  width: 16px; height: 16px; border-radius: 50%; border: none;
  background: transparent; cursor: pointer; color: inherit; font-size: 11px;
  transition: background .12s;
}
.tab .tab-close:hover { background: var(--ibm-gray-20); color: var(--ibm-gray-100); }
.tab.active .tab-close:hover { background: #dbeafe; }

/* ── Workspace ───────────────────────────────────────────────────────────── */
#workspace { display: flex; flex: 1; overflow: hidden; }

/* ── Sidebar ─────────────────────────────────────────────────────────────── */
#sidebar {
  width: var(--sidebar-w); flex-shrink: 0;
  background: var(--ibm-gray-10); border-right: 1px solid var(--ibm-gray-20);
  overflow: hidden; transition: width .2s ease;
  display: flex; flex-direction: column;
}
#sidebar:hover { width: var(--sidebar-open); }
.sidebar-section-label {
  padding: 10px 10px 4px; font-size: 10px; font-weight: 600;
  color: var(--ibm-gray-40); text-transform: uppercase; letter-spacing: .6px;
  white-space: nowrap; overflow: hidden;
}
.sidebar-item {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 10px; cursor: pointer;
  color: var(--ibm-gray-70); font-size: 13px;
  transition: background .1s; white-space: nowrap; overflow: hidden;
}
.sidebar-item:hover { background: var(--ibm-gray-20); color: var(--ibm-gray-100); }
.sidebar-item.active { background: #dbeafe; color: var(--ibm-blue-60); font-weight: 500; }
.sidebar-item .si-icon { font-size: 15px; flex-shrink: 0; }
.sidebar-item .si-label { overflow: hidden; text-overflow: ellipsis; }
.sidebar-folder {
  padding: 6px 10px 2px; font-size: 10px; font-weight: 600;
  color: var(--ibm-gray-40); text-transform: uppercase; letter-spacing: .5px;
  white-space: nowrap; overflow: hidden;
}

/* ── Content panel ───────────────────────────────────────────────────────── */
#content { flex: 1; overflow: hidden; display: flex; flex-direction: column; background: var(--white); }

/* ── Chat toolbar (filter bar) ───────────────────────────────────────────── */
#chat-toolbar {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 16px; border-bottom: 1px solid var(--ibm-gray-20);
  background: var(--white); flex-shrink: 0;
}
#chat-toolbar .filter-label { font-size: 12px; color: var(--ibm-gray-70); }
.filter-pill {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 10px; border: 1px solid var(--ibm-gray-20); border-radius: 12px;
  font-size: 12px; cursor: pointer; background: var(--white); color: var(--ibm-gray-70);
  transition: border-color .12s, background .12s;
}
.filter-pill:hover, .filter-pill.active { border-color: var(--ibm-blue-60); color: var(--ibm-blue-60); background: #eff6ff; }
.filter-pill .pill-x { font-size: 10px; margin-left: 2px; color: var(--ibm-gray-40); }
#filter-dropdown {
  display: none; position: absolute; z-index: 50;
  top: calc(var(--header-h) + var(--tab-h) + 38px); left: 60px;
  background: var(--white); border: 1px solid var(--ibm-gray-20); border-radius: 4px;
  box-shadow: 0 4px 16px rgba(0,0,0,.12); min-width: 220px; padding: 8px 0;
}
#filter-dropdown.open { display: block; }
.filter-group { padding: 4px 0; }
.filter-group-label { padding: 4px 14px; font-size: 11px; font-weight: 600; color: var(--ibm-gray-40); text-transform: uppercase; letter-spacing: .4px; }
.filter-option {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 14px; cursor: pointer; font-size: 13px; color: var(--ibm-gray-100);
}
.filter-option:hover { background: var(--ibm-gray-10); }
.filter-option input[type=checkbox] { accent-color: var(--ibm-blue-60); cursor: pointer; }
.filter-divider { border: none; border-top: 1px solid var(--ibm-gray-20); margin: 4px 0; }

/* ── Chat scroll area ────────────────────────────────────────────────────── */
#chat-scroll { flex: 1; overflow-y: auto; padding: 24px 0 40px; }
#chat-scroll::-webkit-scrollbar { width: 5px; }
#chat-scroll::-webkit-scrollbar-thumb { background: var(--ibm-gray-20); border-radius: 3px; }

/* ── Message rows ─────────────────────────────────────────────────────────── */
.msg-row {
  display: flex; align-items: flex-end;
  padding: 2px 24px; max-width: 900px; margin: 0 auto; width: 100%;
}
.msg-row.user { justify-content: flex-end; }
.msg-row.ai   { justify-content: flex-start; }

/* Column that holds bubble + meta, constrained to bubble width */
.msg-col {
  display: flex; flex-direction: column;
  max-width: 72%;
}
.msg-row.user .msg-col { align-items: flex-end; }
.msg-row.ai   .msg-col { align-items: flex-start; }

.bubble {
  padding: 10px 14px; font-size: 13.5px; line-height: 1.6;
  word-break: break-word;
}
/* AI bubble */
.msg-row.ai .bubble {
  background: var(--ibm-gray-10); color: var(--ibm-gray-100);
  border-radius: 18px 18px 18px 4px;
}
/* User bubble */
.msg-row.user .bubble {
  background: var(--ibm-blue-60); color: var(--white);
  border-radius: 18px 18px 4px 18px;
}
.msg-row.user .bubble .md-view { color: var(--white); }
.msg-row.user .bubble .md-view a { color: #bfdbfe; }
.msg-row.user .bubble .md-view code { background: rgba(255,255,255,.18); color: var(--white); }
.msg-row.user .bubble .md-view pre { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.2); }
.msg-row.user .bubble .md-view blockquote { border-left-color: rgba(255,255,255,.4); background: rgba(255,255,255,.1); color: rgba(255,255,255,.85); }
.msg-row.user .bubble .md-view th { background: rgba(255,255,255,.15); }
.msg-row.user .bubble .md-view th, .msg-row.user .bubble .md-view td { border-color: rgba(255,255,255,.25); }
.msg-row.user .bubble .md-view strong { color: var(--white); }

.msg-meta {
  font-size: 11px; color: var(--ibm-gray-40);
  margin-top: 3px; margin-bottom: 6px;
  display: flex; gap: 6px; align-items: center;
  flex-wrap: wrap;
}
.msg-meta .author-name {
  font-weight: 600; font-size: 11px;
}
.msg-meta .author-name.ai-name { color: var(--ibm-blue-60); }
.msg-meta .author-name.user-name { color: var(--ibm-gray-70); }
.msg-meta .meta-time { color: var(--ibm-gray-40); }
.msg-meta .meta-session {
  font-size: 10px; color: var(--ibm-gray-40);
  font-family: "IBM Plex Mono", Consolas, monospace;
}

/* ── Markdown inside bubbles ──────────────────────────────────────────────── */
.md-view h1 { font-size: 17px; margin: 14px 0 6px; border-bottom: 1px solid rgba(0,0,0,.08); padding-bottom: 4px; }
.md-view h2 { font-size: 15px; margin: 12px 0 5px; }
.md-view h3, .md-view h4 { font-size: 13.5px; margin: 10px 0 4px; }
.md-view p  { margin: 6px 0; }
.md-view ul, .md-view ol { margin: 6px 0 6px 20px; }
.md-view li { margin: 2px 0; }
.md-view code { background: rgba(0,0,0,.07); padding: 1px 5px; border-radius: 3px; font-size: 12px; font-family: "IBM Plex Mono", "SF Mono", Consolas, monospace; }
.md-view pre  { background: #f7f8fa; border: 1px solid var(--ibm-gray-20); border-radius: 6px; padding: 10px 12px; overflow-x: auto; margin: 8px 0; }
.md-view pre code { background: none; padding: 0; }
.md-view blockquote { border-left: 3px solid var(--ibm-gray-20); margin: 8px 0; padding: 4px 12px; color: var(--ibm-gray-70); background: rgba(0,0,0,.03); border-radius: 0 4px 4px 0; }
.md-view strong { font-weight: 600; }
.md-view em { font-style: italic; }
.md-view hr { border: none; border-top: 1px solid var(--ibm-gray-20); margin: 10px 0; }
.md-view a { color: var(--ibm-blue-60); }
.md-view table { border-collapse: collapse; margin: 8px 0; font-size: 13px; }
.md-view th, .md-view td { border: 1px solid var(--ibm-gray-20); padding: 4px 10px; }
.md-view th { background: var(--ibm-gray-10); font-weight: 600; }

/* ── File / Markdown view ────────────────────────────────────────────────── */
#file-view { flex: 1; overflow-y: auto; padding: 28px 36px; }
#file-view .md-view h1 { font-size: 22px; }
#file-view .md-view h2 { font-size: 18px; }

/* ── Welcome screen ──────────────────────────────────────────────────────── */
#welcome { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--ibm-gray-70); padding: 40px; }
#welcome h2 { font-size: 20px; color: var(--ibm-gray-100); }
#welcome p { max-width: 420px; text-align: center; font-size: 13px; }
#welcome code { background: var(--ibm-gray-10); padding: 2px 6px; border-radius: 3px; font-size: 12px; }

/* ── Print ───────────────────────────────────────────────────────────────── */
@media print {
  header, #tab-bar, #sidebar, #chat-toolbar { display: none !important; }
  #workspace { display: block; overflow: visible; }
  #content { overflow: visible; }
  #chat-scroll, #file-view { overflow: visible; }
  .msg-row { break-inside: avoid; }
}
</style>
</head>
<body>
<div id="app">

  <!-- ── Header ──────────────────────────────────────────────────────────── -->
  <header>
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true">
        <rect x="2" y="3" width="11" height="15" rx="2" fill="#4589ff"/>
        <rect x="9" y="1" width="11" height="15" rx="2" fill="#74b1ff" opacity=".75"/>
        <rect x="5" y="8"  width="5" height="1.5" rx=".5" fill="#fff"/>
        <rect x="5" y="11" width="7" height="1.5" rx=".5" fill="#fff"/>
        <rect x="5" y="14" width="6" height="1.5" rx=".5" fill="#fff"/>
      </svg>
      Bob Logbook
    </div>
    <label id="load-btn">
      📂 Load export
      <input type="file" id="file-input" accept=".json,application/json">
    </label>
    <span class="meta" id="header-meta"></span>
  </header>

  <!-- ── Tab bar ─────────────────────────────────────────────────────────── -->
  <div id="tab-bar"></div>

  <!-- ── Main workspace ──────────────────────────────────────────────────── -->
  <div id="workspace">

    <!-- Sidebar -->
    <nav id="sidebar" aria-label="Files"></nav>

    <!-- Content -->
    <div id="content">
      <div id="welcome">
        <h2>Bob Logbook Viewer</h2>
        <p>Load a <code>bob-context-export.json</code> file produced by <code>bob-log export-json</code>, or drop it anywhere on the page.</p>
        <p style="margin-top:4px; font-size:12px;">Or open <code>viewer.html?demo</code> for sample data.</p>
      </div>
    </div>

  </div>

  <!-- Drop overlay -->
  <div id="drop-overlay">Drop to load export</div>

  <!-- Filter dropdown (shared, repositioned by JS) -->
  <div id="filter-dropdown"></div>

</div>

<script>
"use strict";

// ── IBM Carbon author colours ──────────────────────────────────────────────
const AUTHOR_COLOURS = ["#0043CE","#6929C4","#9F1853","#198038","#00539A","#B28600","#570408","#005D5D"];
function authorColour(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = ((h << 5) - h) + name.charCodeAt(i);
  return AUTHOR_COLOURS[Math.abs(h) % AUTHOR_COLOURS.length];
}

// ── Minimal Markdown renderer ─────────────────────────────────────────────
function renderMarkdown(text) {
  function esc(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  const lines = text.split(/\r?\n/);
  const out = []; let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (/^```/.test(line)) {
      i++; const cl = [];
      while (i < lines.length && !/^```/.test(lines[i])) { cl.push(esc(lines[i])); i++; }
      i++; out.push("<pre><code>" + cl.join("\n") + "</code></pre>"); continue;
    }
    if (/^---+$/.test(line.trim())) { out.push("<hr>"); i++; continue; }
    const hm = line.match(/^(#{1,4})\s+(.*)/);
    if (hm) { out.push("<h"+hm[1].length+">"+inline(hm[2])+"</h"+hm[1].length+">"); i++; continue; }
    if (/^>/.test(line)) {
      const bl = [];
      while (i < lines.length && /^>/.test(lines[i])) { bl.push(inline(lines[i].replace(/^>\s?/,""))); i++; }
      out.push("<blockquote>"+bl.join("<br>")+"</blockquote>"); continue;
    }
    if (/^[-*]\s/.test(line)) {
      const ll = [];
      while (i < lines.length && /^[-*]\s/.test(lines[i])) { ll.push("<li>"+inline(lines[i].replace(/^[-*]\s/,""))+"</li>"); i++; }
      out.push("<ul>"+ll.join("")+"</ul>"); continue;
    }
    if (/^\d+\.\s/.test(line)) {
      const ll = [];
      while (i < lines.length && /^\d+\.\s/.test(lines[i])) { ll.push("<li>"+inline(lines[i].replace(/^\d+\.\s/,""))+"</li>"); i++; }
      out.push("<ol>"+ll.join("")+"</ol>"); continue;
    }
    if (/^\|/.test(line) && i+1 < lines.length && /^\|[-|: ]+\|/.test(lines[i+1])) {
      const hd = line.split("|").slice(1,-1).map(c=>"<th>"+inline(c.trim())+"</th>").join("");
      i += 2; const rows = [];
      while (i < lines.length && /^\|/.test(lines[i])) {
        rows.push("<tr>"+lines[i].split("|").slice(1,-1).map(c=>"<td>"+inline(c.trim())+"</td>").join("")+"</tr>"); i++;
      }
      out.push("<table><thead><tr>"+hd+"</tr></thead><tbody>"+rows.join("")+"</tbody></table>"); continue;
    }
    if (line.trim() === "") { i++; continue; }
    const pl = [];
    while (i < lines.length) {
      const l = lines[i];
      if (l.trim()===""||/^#{1,4}\s/.test(l)||/^>/.test(l)||/^[-*]\s/.test(l)||/^\d+\.\s/.test(l)||/^\|/.test(l)||/^```/.test(l)||/^---+$/.test(l.trim())) break;
      pl.push(inline(l)); i++;
    }
    if (pl.length) out.push("<p>"+pl.join(" ")+"</p>");
    else { out.push("<p>"+inline(line)+"</p>"); i++; }
  }
  return out.join("\n");
  function inline(s) {
    return esc(s)
      .replace(/`([^`]+)`/g,"<code>$1</code>")
      .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
      .replace(/__([^_]+)__/g,"<strong>$1</strong>")
      .replace(/\*([^*\s][^*]*[^*\s]|\S)\*/g,"<em>$1</em>")
      .replace(/(^|[\s(>])_([^_\s][^_]*[^_\s]|[^_\s])_([\s,.!?)<]|$)/g,"$1<em>$2</em>$3")
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2">$1</a>');
  }
}

// ── Chat timeline parser ───────────────────────────────────────────────────
// Format (written by bob-log-hook.py):
//   ## Entry-NNN - <type>
//   **Timestamp:** <iso>
//   **Author:** <name>
//   **Type:** <type>
//   **Session:** <id>
//
//   <body>
//   ---
function parseTimeline(text) {
  const entries = [];
  const blocks = text.split(/^(?=## Entry-)/m).filter(b => b.trim());
  for (const block of blocks) {
    if (!/^## Entry-/.test(block)) continue;
    const lines = block.split(/\r?\n/);
    const e = { title:"", timestamp:"", author:"", type:"", session:"", body:"" };
    const tm = lines[0].match(/^##\s+(.+)/);
    e.title = tm ? tm[1].trim() : "";
    let bodyStart = 1;
    for (let i = 1; i < lines.length; i++) {
      const kv = lines[i].match(/^\*\*([^*]+):\*\*\s*(.*)/);
      if (kv) {
        const k = kv[1].toLowerCase(), v = kv[2].trim();
        if (k==="timestamp") e.timestamp=v;
        else if (k==="author") e.author=v;
        else if (k==="type")   e.type=v;
        else if (k==="session") e.session=v;
        bodyStart = i+1;
      } else if (lines[i].trim()==="") { bodyStart=i+1; break; }
      else break;
    }
    e.body = lines.slice(bodyStart).join("\n").replace(/\n---\s*$/,"").trim();
    if (e.body || e.timestamp) entries.push(e);
  }
  return entries;
}

// ── Relative time ──────────────────────────────────────────────────────────
function formatRelative(iso) {
  try {
    const diff = Date.now() - new Date(iso).getTime();
    if (isNaN(diff)) return iso;
    const s = Math.floor(diff/1000), m = Math.floor(s/60), h = Math.floor(m/60), d = Math.floor(h/24);
    if (s < 60)  return "just now";
    if (m < 60)  return m+"m ago";
    if (h < 24)  return h+"h ago";
    if (d < 7)   return d+"d ago";
    return new Date(iso).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
  } catch(e) { return iso; }
}
function escH(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

// ── State ──────────────────────────────────────────────────────────────────
let _files = null;

// Tab registry: id → { label, type ("chat"|"file"), path?, entries?, filter }
const _tabs = new Map();
let _activeTab = null;
let _tabCounter = 0;

// ── Tab engine ─────────────────────────────────────────────────────────────
function createTab(label, type, opts = {}) {
  const id = "tab-" + (++_tabCounter);
  _tabs.set(id, { label, type, ...opts, filter: { authors: null, sessions: null } });
  _renderTabBar();
  selectTab(id);
  return id;
}

function closeTab(id) {
  if (!_tabs.has(id)) return;
  const keys = [..._tabs.keys()];
  _tabs.delete(id);
  if (_activeTab === id) {
    const idx = keys.indexOf(id);
    const next = keys[idx - 1] || keys[idx + 1] || null;
    _activeTab = null;
    if (next && _tabs.has(next)) selectTab(next);
    else _renderTabBar();
  } else {
    _renderTabBar();
  }
}

function selectTab(id) {
  if (!_tabs.has(id)) return;
  _activeTab = id;
  _renderTabBar();
  _renderContent();
}

function _renderTabBar() {
  const bar = document.getElementById("tab-bar");
  bar.innerHTML = "";
  for (const [id, tab] of _tabs) {
    const el = document.createElement("div");
    el.className = "tab" + (id === _activeTab ? " active" : "");
    el.dataset.tabId = id;
    el.innerHTML = escH(tab.label);
    if (tab.closeable !== false) {
      const x = document.createElement("button");
      x.className = "tab-close"; x.textContent = "×"; x.title = "Close";
      x.addEventListener("click", ev => { ev.stopPropagation(); closeTab(id); });
      el.appendChild(x);
    }
    el.addEventListener("click", () => selectTab(id));
    bar.appendChild(el);
  }
}

// ── Filter dropdown ────────────────────────────────────────────────────────
let _filterOpen = false;

function openFilter(tabId, anchorEl) {
  const tab = _tabs.get(tabId);
  if (!tab || tab.type !== "chat") return;
  const dd = document.getElementById("filter-dropdown");

  // Collect unique authors + sessions from this tab's entries
  const entries = tab.entries || [];
  const authors  = [...new Set(entries.map(e => e.author).filter(Boolean))].sort();
  const sessions = [...new Set(entries.map(e => e.session).filter(Boolean))].sort();

  const curAuthors  = tab.filter.authors  || new Set(authors);
  const curSessions = tab.filter.sessions || new Set(sessions);

  let html = "";
  if (authors.length) {
    html += '<div class="filter-group"><div class="filter-group-label">Author</div>';
    for (const a of authors) {
      const chk = curAuthors.has(a) ? "checked" : "";
      html += `<label class="filter-option"><input type="checkbox" data-kind="author" data-val="${escH(a)}" ${chk}> ${escH(a)}</label>`;
    }
    html += "</div>";
  }
  if (sessions.length) {
    if (authors.length) html += '<hr class="filter-divider">';
    html += '<div class="filter-group"><div class="filter-group-label">Session</div>';
    for (const s of sessions) {
      const chk = curSessions.has(s) ? "checked" : "";
      html += `<label class="filter-option"><input type="checkbox" data-kind="session" data-val="${escH(s)}" ${chk}> <code>${escH(s.slice(0,12))}…</code></label>`;
    }
    html += "</div>";
  }
  if (!html) html = '<div style="padding:10px 14px; font-size:13px; color:var(--ibm-gray-70)">No filters available.</div>';

  dd.innerHTML = html;

  // Position below anchor
  const rect = anchorEl.getBoundingClientRect();
  dd.style.top  = (rect.bottom + 4) + "px";
  dd.style.left = rect.left + "px";
  dd.classList.add("open");
  _filterOpen = true;

  // Live filter on checkbox change
  dd.querySelectorAll("input[type=checkbox]").forEach(cb => {
    cb.addEventListener("change", () => {
      const authBoxes = [...dd.querySelectorAll('[data-kind=author]')];
      const sesBoxes  = [...dd.querySelectorAll('[data-kind=session]')];
      tab.filter.authors  = authBoxes.length ? new Set(authBoxes.filter(c=>c.checked).map(c=>c.dataset.val)) : null;
      tab.filter.sessions = sesBoxes.length  ? new Set(sesBoxes.filter(c=>c.checked).map(c=>c.dataset.val))  : null;
      _renderContent();
    });
  });
}

// Filter button — event delegation on #content so it survives innerHTML replacement
document.addEventListener("click", e => {
  const btn = e.target.closest("#filter-btn");
  if (btn) { e.stopPropagation(); openFilter(_activeTab, btn); return; }
  if (_filterOpen && !e.target.closest("#filter-dropdown") && !e.target.closest(".filter-pill")) {
    document.getElementById("filter-dropdown").classList.remove("open");
    _filterOpen = false;
  }
});

// ── Render content ─────────────────────────────────────────────────────────
function _renderContent() {
  const content = document.getElementById("content");
  if (!_activeTab || !_tabs.has(_activeTab)) {
    content.innerHTML = '<div id="welcome"><h2>Bob Logbook Viewer</h2><p>Load a <code>bob-context-export.json</code> file.</p></div>';
    return;
  }
  const tab = _tabs.get(_activeTab);
  if (tab.type === "chat") {
    _renderChat(content, tab);
  } else {
    _renderFile(content, tab);
  }
}

function _renderChat(content, tab) {
  // Toolbar
  let toolbar = `<div id="chat-toolbar"><span class="filter-label">Filter</span>`;
  toolbar += `<button class="filter-pill" id="filter-btn" title="Filter messages">⚙ Filter</button>`;

  // Active filter badges
  if (tab.filter.authors) {
    const allAuthors = [...new Set((tab.entries||[]).map(e=>e.author).filter(Boolean))];
    if (tab.filter.authors.size < allAuthors.length) {
      for (const a of tab.filter.authors)
        toolbar += `<span class="filter-pill active">${escH(a)}</span>`;
    }
  }
  toolbar += `</div>`;

  // Chat messages
  const entries = (tab.entries || []).filter(e => {
    if (tab.filter.authors  && !tab.filter.authors.has(e.author))   return false;
    if (tab.filter.sessions && !tab.filter.sessions.has(e.session)) return false;
    return true;
  });

  let msgs = "";
  for (const e of entries) {
    const isUser = e.type === "user-prompt";
    const rowCls = isUser ? "user" : "ai";
    const relTime = formatRelative(e.timestamp);
    const absTime = e.timestamp;
    const authorCls = isUser ? "user-name" : "ai-name";
    const sessionSnip = e.session ? e.session.slice(0, 8) : "";

    msgs += `<div class="msg-row ${rowCls}">`;
    msgs += `<div class="msg-col">`;
    msgs += `<div class="bubble"><div class="md-view">${renderMarkdown(e.body || "")}</div></div>`;
    msgs += `<div class="msg-meta">`;
    msgs += `<span class="author-name ${authorCls}">${escH(e.author || (isUser ? "user" : "bob"))}</span>`;
    msgs += `<span class="meta-time" title="${escH(absTime)}">${escH(relTime)}</span>`;
    if (sessionSnip) msgs += `<span class="meta-session">${escH(sessionSnip)}</span>`;
    msgs += `</div>`;
    msgs += `</div>`;
    msgs += `</div>`;
  }

  if (!msgs) msgs = `<div style="text-align:center; padding:40px; color:var(--ibm-gray-40); font-size:13px;">No messages match the current filter.</div>`;

  content.innerHTML = toolbar + `<div id="chat-scroll">${msgs}</div>`;

  // Scroll to bottom
  const scroll = content.querySelector("#chat-scroll");
  if (scroll) scroll.scrollTop = scroll.scrollHeight;
}

function _renderFile(content, tab) {
  const mdHtml = renderMarkdown(tab.content || "");
  content.innerHTML = `<div id="file-view"><h2 style="font-size:16px; margin-bottom:16px; border-bottom:1px solid var(--ibm-gray-20); padding-bottom:8px; color:var(--ibm-gray-100)">${escH(tab.path||tab.label)}</h2><div class="md-view">${mdHtml}</div></div>`;
}

// ── Sidebar ────────────────────────────────────────────────────────────────
function buildSidebar(files) {
  const sidebar = document.getElementById("sidebar");
  sidebar.innerHTML = "";

  // Group by folder
  const groups = {};
  for (const path of Object.keys(files)) {
    const slash = path.indexOf("/");
    const folder = slash === -1 ? "" : path.slice(0, slash);
    if (!groups[folder]) groups[folder] = [];
    groups[folder].push(path);
  }

  // Chat section header
  const hasChatFiles = Object.keys(files).some(p => p.startsWith("chat/"));
  if (hasChatFiles) {
    const lbl = document.createElement("div");
    lbl.className = "sidebar-folder"; lbl.textContent = "💬 Chats";
    sidebar.appendChild(lbl);
    for (const path of (groups["chat"] || [])) {
      const item = document.createElement("div");
      item.className = "sidebar-item";
      const label = path.slice("chat/".length);
      item.innerHTML = `<span class="si-icon">👤</span><span class="si-label">${escH(label)}</span>`;
      item.addEventListener("click", () => openChatTab(path));
      sidebar.appendChild(item);
    }
  }

  // File sections
  for (const [folder, paths] of Object.entries(groups)) {
    if (folder === "chat") continue;
    if (folder) {
      const lbl = document.createElement("div");
      lbl.className = "sidebar-folder"; lbl.textContent = "📁 " + folder;
      sidebar.appendChild(lbl);
    }
    for (const path of paths) {
      const item = document.createElement("div");
      item.className = "sidebar-item";
      const label = folder ? path.slice(folder.length+1) : path;
      item.innerHTML = `<span class="si-icon">📄</span><span class="si-label">${escH(label)}</span>`;
      item.addEventListener("click", () => openFileTab(path));
      sidebar.appendChild(item);
    }
  }
}

function openChatTab(path) {
  // Find an existing tab for this path or create one
  for (const [id, tab] of _tabs) {
    if (tab.type === "chat" && tab.path === path) { selectTab(id); return; }
  }
  const author = path.replace("chat/","").replace(".md","");
  const entries = parseTimeline(_files[path] || "");
  createTab("💬 " + author, "chat", { path, entries, closeable: true });
}

function openFileTab(path) {
  for (const [id, tab] of _tabs) {
    if (tab.type === "file" && tab.path === path) { selectTab(id); return; }
  }
  const label = path.split("/").pop();
  createTab("📄 " + label, "file", { path, content: _files[path] || "", closeable: true });
}

// ── Load export ────────────────────────────────────────────────────────────
function loadExport(data) {
  if (!data || !data.files) { alert("Invalid export — expected { files: { ... } }"); return; }
  _files = data.files;

  // Reset tabs
  _tabs.clear(); _activeTab = null; _tabCounter = 0;

  // Build "All Chats" tab
  const chatPaths = Object.keys(_files).filter(p => p.startsWith("chat/"));
  if (chatPaths.length) {
    const allEntries = [];
    for (const p of chatPaths) allEntries.push(...parseTimeline(_files[p]||""));
    allEntries.sort((a,b) => (a.timestamp||"").localeCompare(b.timestamp||""));
    const id = "tab-" + (++_tabCounter);
    _tabs.set(id, { label: "💬 All Chats", type: "chat", path: "__all__", entries: allEntries, filter: { authors: null, sessions: null }, closeable: false });
    _activeTab = id;
  }

  buildSidebar(_files);
  _renderTabBar();
  _renderContent();

  // Header meta
  const count = Object.keys(_files).length;
  const ts = data.exported_at ? " · exported " + formatRelative(data.exported_at) : "";
  document.getElementById("header-meta").textContent = count + " file" + (count !== 1 ? "s" : "") + " · " + (data.branch || "bob-context") + ts;
}

// ── File input ─────────────────────────────────────────────────────────────
document.getElementById("file-input").addEventListener("change", function() {
  const file = this.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = e => { try { loadExport(JSON.parse(e.target.result)); } catch(err) { alert("Could not parse JSON: " + err.message); } };
  r.readAsText(file);
});

// ── Drag and drop (whole page) ─────────────────────────────────────────────
let _dragCount = 0;
document.addEventListener("dragenter", e => { e.preventDefault(); _dragCount++; document.getElementById("drop-overlay").classList.add("active"); });
document.addEventListener("dragleave", () => { _dragCount--; if (_dragCount <= 0) { _dragCount=0; document.getElementById("drop-overlay").classList.remove("active"); } });
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", e => {
  e.preventDefault(); _dragCount=0; document.getElementById("drop-overlay").classList.remove("active");
  const file = e.dataTransfer.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = ev => { try { loadExport(JSON.parse(ev.target.result)); } catch(err) { alert("Could not parse JSON: " + err.message); } };
  r.readAsText(file);
});

// ── Print ──────────────────────────────────────────────────────────────────
// (use browser Ctrl+P / Cmd+P — print button removed from header in this design)

// ── SSE live mode (when served via bob-log serve) ──────────────────────────
if (location.protocol === "http:" || location.protocol === "https:") {
  // Auto-load from server
  fetch("/api/export").then(r => r.json()).then(loadExport).catch(() => {});
  // Stream updates
  const es = new EventSource("/api/stream");
  es.addEventListener("message", () => {
    fetch("/api/export").then(r => r.json()).then(data => {
      if (!data || !data.files) return;
      // Preserve active tab selection
      const prevActive = _activeTab;
      const prevTabPath = _activeTab && _tabs.has(_activeTab) ? _tabs.get(_activeTab).path : null;
      loadExport(data);
      // Try to restore active tab by path
      if (prevTabPath) {
        for (const [id, tab] of _tabs) {
          if (tab.path === prevTabPath) { selectTab(id); break; }
        }
      }
    }).catch(() => {});
  });
}
